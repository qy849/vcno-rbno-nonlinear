[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rbno-nonlinear"
version = "1.0.0"
description = "Reduced basis neural operators trained on nonlinear FOSLS residuals"
readme = "README.md"
license = "GPL-2.0-only"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "torch", "pyyaml", "matplotlib", "pandas", "tqdm"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
ignore = ["E402"]
